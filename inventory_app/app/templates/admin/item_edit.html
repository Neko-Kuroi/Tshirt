{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block content %}
<h1 class="page-title">品番編集</h1>
<form method="post" class="panel d-grid gap-3" style="max-width:560px">
  {{ csrf() }}
  <div class="text-muted">カテゴリー: {{ item.category.name }}</div>
  <input class="form-control" name="brand" value="{{ item.brand }}" placeholder="ブランド">
  <input class="form-control" name="item_no" value="{{ item.item_no }}" placeholder="品番">
  <input class="form-control" name="name" value="{{ item.name }}" placeholder="商品名">
  <input class="form-control" name="note" value="{{ item.note }}" placeholder="メモ">
  <div class="form-check"><input class="form-check-input" type="checkbox" name="is_active" id="ia" {{ 'checked' if item.is_active }}>
    <label class="form-check-label" for="ia">使用中(外すと入荷・変換の候補に出なくなります)</label></div>
  <button class="btn btn-primary">保存</button>
</form>
{% endblock %}
