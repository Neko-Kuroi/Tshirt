{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block content %}
<h1 class="page-title">パスワード変更</h1>
<form method="post" class="panel d-grid gap-3" style="max-width:480px">
  {{ csrf() }}
  <div><label class="form-label">現在のパスワード</label>
    <input class="form-control" name="old" type="password" autocomplete="current-password" required></div>
  <div><label class="form-label">新しいパスワード(8文字以上)</label>
    <input class="form-control" name="new" type="password" autocomplete="new-password" required></div>
  <div><label class="form-label">新しいパスワード(確認)</label>
    <input class="form-control" name="confirm" type="password" autocomplete="new-password" required></div>
  <button class="btn btn-primary">変更する</button>
</form>
{% endblock %}
