{% macro csrf() %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endmacro %}

{% macro qty_input(name="qty", value="", negative=False, label="数量") %}
<label class="form-label" for="{{ name }}">{{ label }}</label>
<div class="qty-step">
  <button type="button" class="btn btn-outline-secondary" data-step="-10">-10</button>
  <button type="button" class="btn btn-outline-secondary" data-step="-1">−</button>
  <input class="form-control" id="{{ name }}" name="{{ name }}" inputmode="numeric" pattern="-?[0-9]*"
         value="{{ value }}" required {% if negative %}data-allow-negative="1"{% endif %}>
  <button type="button" class="btn btn-outline-secondary" data-step="1">＋</button>
  <button type="button" class="btn btn-outline-secondary" data-step="10">+10</button>
</div>
{% endmacro %}

{% macro delta(n) %}<span class="num {{ 'delta-pos' if n > 0 else 'delta-neg' }}">{{ '%+d' % n }}</span>{% endmacro %}
